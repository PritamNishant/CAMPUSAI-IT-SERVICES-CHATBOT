<!DOCTYPE html>
<html>
<head>
    <title>Browser Exact Error Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        #log { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Browser Exact Error Test</h1>
    <p>This will test the EXACT error that occurs in the browser</p>
    
    <button onclick="runTest()">Run Test</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div id="log"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:5001/api';
        let conversationState = {
            conversation_id: null,
            conversationHistory: []
        };
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function runTest() {
            clearLog();
            log('='.repeat(70), 'info');
            log('STARTING BROWSER EXACT ERROR TEST', 'info');
            log('='.repeat(70), 'info');
            
            // Step 1: Register
            log('\nSTEP 1: Registering user...', 'info');
            try {
                const regResponse = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName: 'Browser',
                        lastName: 'Test',
                        email: `browser${Date.now()}@test.com`,
                        password: 'Test123!',
                        usertype: 'student',
                        registration_number: `REG${Date.now()}`
                    })
                });
                
                log(`Registration status: ${regResponse.status}`, 'info');
                
                if (regResponse.ok) {
                    const regData = await regResponse.json();
                    const token = regData.token;
                    log(`✓ Token received (length: ${token.length})`, 'success');
                    
                    // Step 2: Send chat message
                    log('\nSTEP 2: Sending chat message "Hello"...', 'info');
                    
                    const message = 'Hello';
                    
                    // Add to conversation history (mimicking real code)
                    conversationState.conversationHistory.push({
                        role: 'user',
                        content: message,
                        timestamp: new Date()
                    });
                    
                    log(`Calling: ${API_BASE_URL}/chat/send`, 'info');
                    log(`Token: ${token.substring(0, 20)}...`, 'info');
                    
                    const chatResponse = await fetch(`${API_BASE_URL}/chat/send`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            message: message,
                            conversation_id: conversationState.conversation_id,
                            state: conversationState
                        })
                    });
                    
                    log(`Chat response status: ${chatResponse.status}`, 'info');
                    log(`Chat response ok: ${chatResponse.ok}`, 'info');
                    
                    if (!chatResponse.ok) {
                        log(`✗ Response not OK! Status: ${chatResponse.status}`, 'error');
                        const errorText = await chatResponse.text();
                        log(`Error body: ${errorText}`, 'error');
                        throw new Error(`API error: ${chatResponse.status}`);
                    }
                    
                    const chatData = await chatResponse.json();
                    log(`✓ Response parsed successfully`, 'success');
                    log(`Response structure:`, 'info');
                    log(`  - conversation_id: ${chatData.conversation_id ? 'YES' : 'NO'}`, 'info');
                    log(`  - response: ${chatData.response ? 'YES' : 'NO'}`, 'info');
                    log(`  - response.message: ${chatData.response?.message ? 'YES' : 'NO'}`, 'info');
                    
                    if (chatData.response?.message) {
                        log(`\n✓ LLM Response:`, 'success');
                        log(`   ${chatData.response.message.substring(0, 100)}...`, 'success');
                        log(`\n${'='.repeat(70)}`, 'success');
                        log('✓✓✓ SUCCESS! THE FLOW WORKS IN BROWSER! ✓✓✓', 'success');
                        log('='.repeat(70), 'success');
                        log('\nThis means the error is SPECIFIC to the main chatbot.js code', 'info');
                    } else {
                        log(`✗ response.message is missing`, 'error');
                        log(`Full response: ${JSON.stringify(chatData)}`, 'error');
                    }
                    
                } else {
                    log(`✗ Registration failed: ${regResponse.status}`, 'error');
                    const errorData = await regResponse.json();
                    log(`Error: ${JSON.stringify(errorData)}`, 'error');
                }
                
            } catch (error) {
                log(`\n${'='.repeat(70)}`, 'error');
                log('✗✗✗ EXCEPTION CAUGHT ✗✗✗', 'error');
                log('='.repeat(70), 'error');
                log(`Error type: ${error.constructor.name}`, 'error');
                log(`Error message: ${error.message}`, 'error');
                log(`Error stack:`, 'error');
                log(error.stack, 'error');
                
                // Check for specific error types
                if (error.message.includes('Failed to fetch')) {
                    log(`\n>>> DIAGNOSIS: Network/CORS error`, 'error');
                    log(`>>> This means the browser cannot reach the backend`, 'error');
                    log(`>>> Check: Is backend running? CORS enabled? Mixed content?`, 'error');
                } else if (error.message.includes('JSON')) {
                    log(`\n>>> DIAGNOSIS: JSON parsing error`, 'error');
                    log(`>>> The response is not valid JSON`, 'error');
                } else if (error.message.includes('401')) {
                    log(`\n>>> DIAGNOSIS: Authentication error`, 'error');
                    log(`>>> Token is invalid or expired`, 'error');
                } else {
                    log(`\n>>> DIAGNOSIS: Unknown error`, 'error');
                }
            }
        }
    </script>
</body>
</html>
